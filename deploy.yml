name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change this to master if your default branch is called master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js (Installs npm) 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies 🔧
        run: npm ci  # This is a faster, cleaner version of 'npm install' for automation

      - name: Build Project 🏗️
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Change to 'build' if you are using Create React App instead of Vite
          branch: gh-pages # This creates a special separate branch just for your live site
